# Compiles the project, runs the unit tests and runs Checkstyle (report-only) on Java 11.
name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

permissions:
  contents: read

# A newer push to the same pull request or branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, Checkstyle (Java 11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      # Headless: the Swing view tests build components but never open a window.
      - name: Build, run the tests and Checkstyle
        run: mvn -B verify -Djava.awt.headless=true
